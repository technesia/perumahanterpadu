name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tprm
          POSTGRES_PASSWORD: tprm_ci
          POSTGRES_DB: tprm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tprm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Hanya untuk CI — bukan rahasia production.
      DATABASE_URL: postgresql://tprm:tprm_ci@localhost:5432/tprm?schema=public
      # Test membuat database sementara tprm_test_run_<timestamp> dari koneksi ini, lalu menghapusnya.
      TEST_DATABASE_URL: postgresql://tprm:tprm_ci@localhost:5432/tprm_test?schema=public
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      DATA_ENCRYPTION_KEY: ci-only-data-encryption-key-0123456789
      ORGANIZATION_SLUG: taman-pesona-rajeg-mulya
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration dari database kosong & seed dua kali (idempoten)
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed

      - name: Automated tests
        run: npm test

      - name: Production build
        run: npm run build
